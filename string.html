
<html>
<head>
<title>WEB</title>
</head>
<body bgcolor = "yellow">
<h1><center><i>string and math functions<i></center></h1>
<script>
var a = "hello";
var b = "HAI";
var c = "how r u";
document.write("string1 = " + a + "<br><br>");
document.write("string2 = " + b + "<br><br>");
document.write("string3 = " + c + "<br><br>"); 
                                                                                                              
document.write("<h2>String Function</h2>")

document.write("uppercase=" + a.toUpperCase() + "<br><br>")
document.write("lowercase=" + a.toLowerCase() + "<br><br>")
document.write("replace=" + c.replace("r","are") + "<br><br>")
document.write("length of c=" + c.length + "<br><br>")
document.write("slice=" + a.slice(2,3))

document.write("<h2>Math Function</h2>")
var d = 5
var e = -12
document.write("sqrtroot=" + Math.sqrt(d) + "<br><br>")
document.write("power=" + Math.pow(d,e) + "<br><br>")
document.write("absolute value=" + Math.abs(e) + "<br><br>")
document.write("ceil=" + Math.ceil(4.8) + "<br><br>")
document.write("floor=" + Math.floor(3.2) + "<br><br>")
document.write("round=" + Math.round(d) + "<br><br>")
document.write("min=" + Math.min(23,5,6) + "<br><br>")
document.write("max=" + Math.max(23,5,6) + "<br><br>")




</script>
</body>
</html>
