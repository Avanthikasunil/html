<!DOCTYPE HTML>
<html>
<head>
<title>registration form</title>
</head>
<body>
<center>
<h2>STUDENT REGISTRATION FORM</h2>
<form>

<label>Name:</label>
<input type="text" name="name">
<br><br>

<label>Email:</label>
<input type="text" name="email">
<br><br>

<label>Password:</label>
<input type="text" name="password">
<br><br>

<label>Age:</label>
<input type="text" name="age">
<br><br>

<label>Gender:</label>
<input type="radio" name="gender" value="male">male
<input type="radio" name="gender" value="female">female
<br><br>

<label>Course:</label>
<select name="course">
<option>MCA</option>
<option>M TECH</option>
<option>MBA</option>
<option>B TECH CIVIL</option>
<option>B TECH CS</option>
<option>B TECH MECH</option>
<option>B TECH ELECTRIC</option>
</select>
<br><br>

<label>Hobbies:</label>
<input type="checkbox" name="hobby" value="drawing">drawing
<input type="checkbox" name="hobby" value="dancing">dancing
<input type="checkbox" name="hobby" value="music">music
<input type="checkbox" name="hobby" value="reading">reading
<input type="checkbox" name="hobby" value="sports">sports
<br><br>

<label>Address:</label><br>
<textarea name="address" rows="4" cols="30"></textarea>
<br><br>

<label>Date of birth:</label>
<input type="date" name="dob">
<br><br>

<input type="submit" value="Register">
<input type="reset" value="clear">

</center>
</form>
</body>
</html>
